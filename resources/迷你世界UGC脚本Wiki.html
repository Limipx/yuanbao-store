<title>迷你世界 UGC 3.0 脚本 Wiki · 增强版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--bd:#30363d;--fg:#e6edf3;--dim:#8b949e;--ac:#58a6ff;--ok:#3fb950;--wn:#d29922;--er:#f85149}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:64px}
.hd{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--bd);padding:8px 12px}
.hd h1{font-size:15px;margin:0 0 6px;display:flex;align-items:center;gap:6px}
.hd h1 b{color:var(--ac)}
.ver{font-size:10px;background:#1f6feb22;color:var(--ac);padding:1px 6px;border-radius:8px;font-weight:400}
.sw{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:8px 11px;color:var(--fg);font-size:13px;font-family:inherit}
.sw:focus{outline:none;border-color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:7px 12px;background:var(--bg2);border-bottom:1px solid var(--bd);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--bg3);border:1px solid var(--bd);border-radius:14px;padding:3px 11px;font-size:12px;color:var(--dim);white-space:nowrap;cursor:pointer;flex:none}
.chip.on{background:#1f6feb;color:#fff;border-color:#1f6feb}
.main{padding:12px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:9px;padding:12px;margin-bottom:10px}
.card h2{font-size:14px;margin:0 0 8px;color:var(--fg);display:flex;align-items:center;gap:6px}
.card h3{font-size:13px;margin:12px 0 6px;color:var(--ac)}
.card p{margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.st{background:var(--bg3);border-radius:7px;padding:9px;text-align:center}
.st b{display:block;font-size:19px;color:var(--ac)}
.st span{font-size:11px;color:var(--dim)}
.mod{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-bottom:1px solid var(--bd);cursor:pointer;gap:8px}
.mod:last-child{border:0}
.mod:hover{background:var(--bg3)}
.mod .n{font-size:13px;font-weight:500}
.mod .n em{font-style:normal;color:var(--dim);font-size:11px;margin-left:5px}
.mod .c{font-size:11px;color:var(--dim);white-space:nowrap}
.mod .star{color:#484f58;font-size:15px;flex:none}
.mod .star.on{color:var(--wn)}
.fn{font:12px/1.5 Consolas,Monaco,monospace;padding:4px 7px;background:var(--bg3);border-radius:4px;margin:3px;display:inline-block;cursor:pointer;word-break:break-all}
.fn:hover{background:#1f6feb33}
.fn.c{color:var(--wn)}
.fn.f{color:var(--ac)}
.lbl{font-size:11px;color:var(--dim);margin:8px 0 3px;display:flex;align-items:center;gap:5px}
.lbl i{width:7px;height:7px;border-radius:2px;font-style:normal}
code{background:var(--bg3);padding:1px 5px;border-radius:3px;font:12px Consolas,monospace;color:#7ee787}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:10px;overflow-x:auto;font:11.5px/1.55 Consolas,monospace;margin:8px 0;color:#c9d1d9}
pre::-webkit-scrollbar{height:5px}
pre::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
.k{color:#ff7b72}.s{color:#a5d6ff}.c{color:#8b949e}.f{color:#d2a8ff}
table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
th,td{padding:5px 7px;border:1px solid var(--bd);text-align:left;vertical-align:top}
th{background:var(--bg3);color:var(--dim);font-weight:500}
.nv{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--bd);display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
.nv button{flex:1;background:0;border:0;color:var(--dim);padding:9px 0;font-size:11px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nv button.on{color:var(--ac)}
.nv button i{font-style:normal;font-size:16px}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;margin-right:5px}
.t-ok{background:#2ea04326;color:var(--ok)}
.t-no{background:#f8514926;color:var(--er)}
.t-wn{background:#d2992226;color:var(--wn)}
.t-nw{background:#58a6ff26;color:var(--ac)}
.bk{background:var(--bg3);border-left:3px solid var(--ac);padding:8px 11px;border-radius:0 6px 6px 0;margin:8px 0;font-size:12.5px}
.bk.w{border-color:var(--wn)}
.bk.e{border-color:var(--er)}
.bk.g{border-color:var(--ok)}
.hid{display:none}
.sec{font-size:11px;color:var(--dim);padding:6px 11px;background:var(--bg3);border-bottom:1px solid var(--bd);position:sticky;top:0}
.empty{text-align:center;color:var(--dim);padding:28px;font-size:13px}
.cp{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ok);color:#000;padding:6px 15px;border-radius:16px;font-size:12px;z-index:99;opacity:0;transition:.2s}
.cp.on{opacity:1}
</style>

const KB=[{"i":"iron","t":"🔥 引擎元数据五条铁律","b":"<div class=\"bk e\"><b>必须先读这一篇。</b>违反任何一条的表现都是「导入成功、看得到函数名、调用返回 nil」，极难排查。</div>\n<h3>铁律 1 · propertys / openFnArgs / openFunctions 必须留顶层</h3>\n<p>引擎在<b>加载期</b>读这些表。挪进 <code>OnStart</code> 函数体 = 加载期读到空表。</p>\n<pre><span class=\"c\">-- ❌ 错误：搬进函数体</span>\n<span class=\"k\">function</span> Script:OnStart()\n  Script.propertys = {...}   <span class=\"c\">-- 引擎已经读完了，来不及</span>\n<span class=\"k\">end</span></pre>\n<div class=\"bk w\">后果链：propertys 读不到 → 属性面板空白 → tableIds 属性拿不到 → 二维表读不了。</div>\n\n<h3>铁律 2 · 元数据区的字符串不能用 _DEC</h3>\n<p><code>_DEC</code> 是 chunk 顶层 local，引擎在受限环境求值元数据时<b>看不见它</b>。一旦元数据里出现 <code>_DEC(...)</code>，整张表求值失败。</p>\n<pre><span class=\"c\">-- ❌ displayName = _DEC(\"...\")</span>\n<span class=\"c\">-- ✅ 用 string.char，只用全局，面板照常显示</span>\ndisplayName = <span class=\"f\">string</span>.char(233,151,174,...)</pre>\n\n<h3>铁律 3 · 生命周期函数（On* 开头）永不改名</h3>\n<p>引擎按名字调用，不走 openFnArgs 表。改名 = 组件不初始化。</p>\n\n<h3>铁律 4 · 元方法（__index 等）永不改名</h3>\n<p>开放函数扫描按 <code>function X.Y(</code> 匹配，会把 <code>meta.__index</code> 误抓成开放函数。改名后 <code>setmetatable</code> 的 <code>__index</code> 槽位变 nil。</p>\n\n<h3>铁律 5 · 登记表键必须与函数名同步改名</h3>\n<p><code>openFnArgs</code> 的键就是函数名（值是占位 true）。改了函数定义不改键 = 引擎按旧名找不到函数。</p>\n<div class=\"bk\"><b>两种登记表都要覆盖</b>：新格式 <code>openFunctions</code>、旧格式 <code>openFnArgs</code>。只认一个 = 另一种格式的脚本全废。</div>\n\n<h3>真实踩坑记录</h3>\n<table><tr><th>现象</th><th>根因</th></tr>\n<tr><td>触发器里看不到函数</td><td>只认 openFunctions，漏了 openFnArgs</td></tr>\n<tr><td>属性面板空白 + 二维表读不了</td><td>propertys 被移入 OnStart</td></tr>\n<tr><td>界面和代码打架</td><td>复选框写 checked，代码注释写「默认 false」</td></tr>\n<tr><td>混淆后组件属性被加密，面板乱码</td><td>元数据用了 _DEC</td></tr></table>"},{"i":"bus","t":"📡 广播通信体系","b":"<h3>三套机制，别混用</h3>\n<table><tr><th>机制</th><th>范围</th><th>接口</th></tr>\n<tr><td>对象事件</td><td>同一对象上的组件之间</td><td><code>PushEvent</code> / <code>AddEvent</code></td></tr>\n<tr><td>房间广播</td><td>全房间所有组件</td><td><code>PushCustomEvent</code> / <code>AddCustomEvent</code></td></tr>\n<tr><td>云服广播</td><td>跨房间，可定向</td><td><code>PushCloudServerMsg</code> / <code>AddCloudSeverEvent</code></td></tr></table>\n<div class=\"bk w\">很多人把 <code>PushEvent</code> 当广播用，结果只有同对象的组件收到 —— 这是两套东西。</div>\n\n<h3>消息 ID 必须预设</h3>\n<p>不能自定义字符串 ID，必须填预设的。<span class=\"tag t-nw\">硬约束</span></p>\n\n<h3>参数：数量不限，可直接传 table</h3>\n<div class=\"bk g\"><b>table 可以直接传</b>，这是官方支持的用法，比官网描述的「多个基本数据类型」更宽。传过去的是<b>值（副本）</b>不是引用：对方改了你看不到。需要双向同步就显式回发一条。</div>\n<div class=\"bk w\"><b>易混点澄清</b>：不能广播的是 <code>_G</code>（全局表），因为发送权限不足；这与「能不能传 table」是两回事。普通 table 参数照常可传。</div>\n\n<h3>云服广播第三参数 = 定向房间</h3>\n<pre><span class=\"c\">-- 只向指定房间发</span>\nCloudSever.PushCloudServerMsg(msgId, args, roomId)</pre>\n\n<h3>MiniBus：一个 ID 当无数个用</h3>\n<p>信封协议 <code>route\\1mid\\1payload</code> 塞进<b>单个参数</b>发出去，接收端解包按 route 路由。这样一个预设 ID 承载无限个逻辑通道，还支持 <code>背包.*</code> 前缀通配订阅。</p>\n<pre><span class=\"c\">-- 发送</span>\nMiniBus.Publish(<span class=\"s\">\"背包.更新\"</span>, {id=1001, n=5})\n<span class=\"c\">-- 订阅（支持通配符）</span>\nMiniBus.Subscribe(<span class=\"s\">\"背包.*\"</span>, <span class=\"k\">function</span>(route, data) ... <span class=\"k\">end</span>)</pre>\n<div class=\"bk\">内置自研序列化：支持嵌套表、环形引用截断、浮点 <code>%.17g</code> 无损往返。序列化用于<b>把任意结构塞进单个参数做信封路由</b>，不是因为 table 传不了。</div>\n\n<h3>发送权限不可用时的降级</h3>\n<p><code>PushCustomEvent(\"m...\", _G)</code> 需要权限，用不了。MiniBus 内置自动降级：发送失败走本地 dispatch（<code>_G</code> 直连），逻辑不断。拿到权限后自动切回真广播，代码不用改。</p>\n<div class=\"bk w\">真实失败表现未知（返回 false / 报错 / 静默），真机未测</div>"},{"i":"prop","t":"🧩 组件属性全表","b":"<h3>官网只公开 13 种，实际 50+ 种</h3>\n<p>官网查不到的那 37 种（Vec2 / Rotation / Entity / Player / Area / Action …）没有官方说明，只能以手册为准。<span class=\"tag t-wn\">未验证</span></p>\n\n<h3>Mini 类型系统（转储实证 51 项）</h3>\n<p>Array Number Bool String Block Item Mob Entity Player Creature Role Object Area Pos Vec2 Vec3 Color Rotation Scale Model Effect Sound Material Texture Prefab Blueprint Enum PathPoint CheckList ListData SortedData Map Tag Buff CustomData CustomMsg ComponentType MobType EntityType CreatureType BiomeType PlayerType Action ModelAction LineAnimation Picture SkeletonPoint ColorGrandient SkyBox SkyBoxFilter GroupView UiState UiElement DropItem ThrowItem</p>\n<div class=\"bk g\"><b>关键规律</b>：每个 <code>Mini.X.__className_</code> 恒等于 <code>\"X\"</code>，50 种无一例外。可用 <code>propertytype.__className_</code> 通用取类型名。</div>\n<div class=\"bk w\"><code>Mini</code> 在转储里只有 <code>Array</code> 一个显式字段，其余走元表 <code>__index</code>，转储抓不到。<b>转储存在 ≠ 可用，必须实测。</b></div>\n\n<h3>1.53+ 新增 7 种「组」类型</h3>\n<p>数值组 / 字符串组 / 布尔组 / 方块组 / 道具组 / 生物组 / 计时器组 / 特效组。VarType 编号 17–24（NumberGroup StringGroup BooleanGroup BlockTypeGroup ItemTypeGroup CreatureTypeGroup TimerGroup EffectTypeGroup）。</p>\n<div class=\"bk w\">脚本侧写法推测是 <code>Mini.Array(itemType)</code>，<b>未验证</b>。验证方法：建一个数值组属性，用探针打印其 <code>type</code> 字段的实际值。</div>\n\n<h3>官网确认的新字段</h3>\n<table><tr><th>字段</th><th>作用</th></tr>\n<tr><td><code>isSave = false</code></td><td>不自动落地，出区块重载回默认值（默认自动保存）</td></tr>\n<tr><td><code>permission</code></td><td><code>CmpProPermission.Private</code> / <code>Read</code>，默认 Public</td></tr>\n<tr><td><code>tips</code> / <code>sort</code></td><td>官网没提，手册有，冲突时以实测为准</td></tr></table>\n<div class=\"bk\">官方建议：<b>用属性存数据，别用全局变量</b>。</div>\n\n<h3>CustomData 自定义结构</h3>\n<p>很好用，可存任意结构。注意引擎加载期的求值环境限制（见铁律 2）。</p>"},{"i":"arr","t":"🔧 arrayWrapper 数组返回机理","b":"<h3>为什么需要它</h3>\n<p><code>Mini.Array(itemType)</code> 返回引擎原生 userdata，其 <code>__className_</code> <b>恒为 \"Array\"</b>，无法表达元素类型；而引擎解析返回值时只认 <code>__className_</code>。所以必须造假 table 拦截查询。</p>\n\n<h3>真机实测查询序列</h3>\n<pre>String : Array → Array → <b>String</b> → Array → Array\n                          ↑ 第 3 次给元素类型</pre>\n\n<h3>getcount == 3 是引擎硬编码</h3>\n<table><tr><th>给元素类型的时机</th><th>序列</th></tr>\n<tr><td>第 1 次</td><td>String > Array > Array > Array > Array</td></tr>\n<tr><td>第 2 次</td><td>Array > String > Array > Array > Array</td></tr>\n<tr><td><b>第 3 次</b></td><td><b>Array > Array > String > Array > Array ✅</b></td></tr>\n<tr><td>第 4 次</td><td>Array > Array > Array > String > Array</td></tr></table>\n<div class=\"bk e\">改计数就整体错位，Lua 只能迎合。</div>\n\n<h3>九项耦合细节都不能动</h3>\n<p>新建空 table、<code>__index</code>、计数到 3、前两次返 \"Array\"、其余转发 userdata、<code>setmetatable</code>、闭包捕获 propertytype……</p>\n\n<h3>唯一可安全改进处</h3>\n<p>原版第 3 次返回是硬编码 if-else，只覆盖 String/Number/Bool/Item，<b>其余 46 种全返回 \"Unknown\"</b>。改成：</p>\n<pre><span class=\"k\">return</span> propertytype.__className_ <span class=\"k\">or</span> <span class=\"s\">\"Unknown\"</span></pre>\n<div class=\"bk g\">实测 Vec3、Color 从 Unknown → 正常 ✅</div>\n\n<pre><span class=\"k\">local function</span> arrayWrapper(propertytype)\n    <span class=\"k\">local</span> arrayUserData = Mini.Array(propertytype)\n    <span class=\"k\">local</span> newArray = {}\n    <span class=\"k\">local</span> meta = {}\n    <span class=\"k\">local</span> getcount = 0\n    <span class=\"k\">function</span> meta.__index(_, key)\n        <span class=\"k\">if</span> key == <span class=\"s\">'__className_'</span> <span class=\"k\">then</span>\n            getcount = getcount + 1\n            <span class=\"k\">if</span> getcount == 3 <span class=\"k\">then</span>\n                <span class=\"k\">return</span> propertytype.__className_ <span class=\"k\">or</span> <span class=\"s\">\"Unknown\"</span>\n            <span class=\"k\">else</span>\n                <span class=\"k\">return</span> <span class=\"s\">\"Array\"</span>\n            <span class=\"k\">end</span>\n        <span class=\"k\">else</span>\n            <span class=\"k\">return</span> arrayUserData[key]\n        <span class=\"k\">end</span>\n    <span class=\"k\">end</span>\n    <span class=\"k\">return</span> setmetatable(newArray, meta)\n<span class=\"k\">end</span></pre>\n<div class=\"bk w\"><b>位置要求</b>：必须定义在 openFnArgs 之前。纯 Lua 语义 —— <code>returnType = arrayWrapper(...)</code> 在构造表时立即执行。</div>"},{"i":"ctx","t":"🔀 两套脚本上下文","b":"<h3>组件脚本（新）vs 触发器脚本（旧）</h3>\n<table><tr><th></th><th>组件脚本</th><th>触发器脚本</th></tr>\n<tr><td>载体</td><td>挂在对象上的组件</td><td>独立触发器</td></tr>\n<tr><td>注册</td><td><code>self:AddTriggerEvent(...)</code></td><td><code>ScriptSupportEvent:registerEvent(...)</code></td></tr>\n<tr><td>自函数</td><td><code>self:Fn()</code></td><td>全局函数</td></tr>\n<tr><td>推荐</td><td><b>✅ 新项目一律用这套</b></td><td>旧项目维护</td></tr></table>\n\n<h3>关键发现：TriggerEvent 把两套连起来了</h3>\n<p>转储里 <code>TriggerEvent.Xxx</code> <b>252 个全部有值，且值就是字符串事件名</b>：</p>\n<pre>TriggerEvent.ActorCreate        = <span class=\"s\">\"Actor.Create\"</span>\nTriggerEvent.GameHour           = <span class=\"s\">\"Game.Hour\"</span>\nTriggerEvent.PlayerMountActor   = <span class=\"s\">\"Player.MountActor\"</span></pre>\n<div class=\"bk g\">所以两种写法<b>等价</b>：\n<br>旧：<code>ScriptSupportEvent:registerEvent([=[Player.ClickBlock]=], fn)</code>\n<br>新：<code>self:AddTriggerEvent(TriggerEvent.PlayerClickBlock, self.fn)</code></div>\n\n<h3>对象事件（self 上的）</h3>\n<pre><span class=\"k\">function</span> M:OnStart()\n  self:AddEvent(ObjectEvent.ActorCreate, self.OnCreate)\n<span class=\"k\">end</span>\n<span class=\"k\">function</span> M:OnCreate(e) ... <span class=\"k\">end</span></pre>\n<p><code>ObjectEvent</code> 有 183 项，<code>TriggerEvent</code> 有 253 项，都可在 API 页翻阅。</p>"},{"i":"env","t":"⚠️ 环境能力与限制","b":"<table><tr><th>能力</th><th>状态</th><th>说明</th></tr>\n<tr><td><code>loadstring</code></td><td><span class=\"tag t-no\">nil</span></td><td>真机实测返回 nil，被 stub</td></tr>\n<tr><td><code>loadfile</code> / <code>dofile</code></td><td><span class=\"tag t-nw\">?</span></td><td>转储存在，未测</td></tr>\n<tr><td><code>string.dump</code></td><td><span class=\"tag t-ok\">可用</span></td><td>LuaVM 用它探测字节码版本，已加兜底</td></tr>\n<tr><td><code>bit.*</code></td><td><span class=\"tag t-ok\">可用</span></td><td>bor bxor band bnot lshift rshift arshift rol ror tobit tohex bswap（12 个）</td></tr>\n<tr><td><code>bit32</code></td><td><span class=\"tag t-no\">无</span></td><td>5.1 环境</td></tr>\n<tr><td><code>json</code></td><td><span class=\"tag t-ok\">可用</span></td><td>encode / decode</td></tr>\n<tr><td><code>os.timeMs</code></td><td><span class=\"tag t-ok\">可用</span></td><td>毫秒时间戳</td></tr>\n<tr><td><code>threadpool</code></td><td><span class=\"tag t-ok\">可用</span></td><td>Work / work / wait / Wait</td></tr>\n<tr><td><code>_VERSION</code></td><td>Lua 5.1</td><td></td></tr></table>\n\n<div class=\"bk e\"><b>转储存在 ≠ 可用。</b><code>loadstring</code> 在转储里存在但你实测返回 nil → 被 stub。以后判断必须实测，不能只看清单。</div>\n\n<h3>loadstring 不可用的绕行方案</h3>\n<p>纯 Lua 实现的 Lua 5.1 编译器 + VM（5100 行）：自解析 → 自编译字节码 → 自写 VM 执行。</p>\n<table><tr><th>项目</th><th>结果</th></tr>\n<tr><td>片段测试</td><td>8/8 通过</td></tr>\n<tr><td>极端环境（dump+loadstring 都移除）</td><td>仍 8/8</td></tr>\n<tr><td>宿主 ↔ VM 双向交互</td><td>17/17，VM 内可调 Mini API</td></tr>\n<tr><td><b>速度</b></td><td><b>慢 ~1467 倍</b></td></tr></table>\n<div class=\"bk e\">只适合启动时算一次（激活校验、配置生成）。<b>绝不进热路径</b>。</div>\n<p>编译很快 0.2ms、VM 初始化 3.4ms —— 慢在每条指令的解释执行，是持续代价不是启动代价。</p>\n\n<h3>二维表限制</h3>\n<p>500KB / 2000 行上限。26M 模型权重需切进 70 张表。压缩链：deflate → Base85 → 分表 → 回读校验。</p>"},{"i":"hide","t":"🕳️ 隐藏接口（官方未写）","b":"<div class=\"bk w\">以下均来自环境转储，<b>官方一个字没提</b>。多数未实测，用前先验证。</div>\n\n<h3>*Edit 编辑期模块族（15 个）</h3>\n<p>CraftingEdit / BlockEdit(19) / GunEdit(15) / ProjectileEdit / ItemEdit / FoodEdit / ToolEdit / MonsterEdit / StatusEdit / EquipEdit / PackEdit / FurnaceEdit / BlockStateEdit / OldGunEdit / UseEdit</p>\n<div class=\"bk\">命名看是<b>用脚本配置 MOD 内容</b>（合成表、枪械、投掷物、装备）。潜力最大，但<b>调用时机未验证</b>。</div>\n\n<h3>Trigger 子模块（20 个）</h3>\n<p>Trigger.Player(71) / Trigger.Math(55) / Trigger.Actor(50) / Trigger.World(48) / Trigger.Graphics(33) / Trigger.ArrayTmp(33) / Trigger.Component(17) / Trigger.Buff / Trigger.Item / Trigger.KvMap / Trigger.CustomUI …</p>\n\n<h3>真多线程 threadpool</h3>\n<pre>threadpool.Work(fn)  <span class=\"c\">-- 提交任务</span>\nthreadpool.wait()    <span class=\"c\">-- 等待</span></pre>\n<div class=\"bk\">官方完全没提。<b>未实测</b>。</div>\n\n<h3>类系统</h3>\n<pre><span class=\"k\">local</span> MyClass = Class(...)   <span class=\"c\">-- 定义类</span>\n<span class=\"k\">local</span> inst = Instance(...)  <span class=\"c\">-- 实例</span>\nGetInst(...)                 <span class=\"c\">-- 取实例</span></pre>\n\n<h3>跨 MOD 数据交换</h3>\n<pre>Export(key, value)   <span class=\"c\">-- 导出</span>\nImport(key)          <span class=\"c\">-- 导入</span>\nGetModId()           <span class=\"c\">-- 当前 MOD ID</span>\nMod.GetCustomAssetIdByObjId(...)  <span class=\"c\">-- 资源 ID 转换（8 个相关函数）</span></pre>\n\n<h3>Lua 原生扩展</h3>\n<pre>string.split / string.startswith / string.endswith / string.Trim / string.IsBlank / string.Contains\ntable.clone / table.merge / table.num_pairs / table.equal / table.tostring\nmath.clamp / math.lerp / math.approximately / math.mod\nos.timeMs\njson.encode / json.decode\nLog.PrintTable / Log.TableToString / Log.ReportError</pre>\n\n<h3>其他</h3>\n<p>copy_table / GetS / SetDebugInfo / printError / LuaPanda / DevComponentDebug / __CallComponentDebugFn / ClientPositive / OfficeUtils</p>"},{"i":"obf","t":"🛡️ 混淆与脚本保护","b":"<h3>四层保护</h3>\n<ol><li>开放函数转发入 local</li><li>标识符重命名</li><li>字符串 <code>_DEC</code> 加密</li><li>签名 + 指纹防篡改</li></ol>\n\n<h3>密钥激活</h3>\n<ul><li>PBKDF2-HMAC-SHA256 派生，只存校验值<b>不存密钥</b></li>\n<li>CTR 流加密工作常量；密钥错了算出来的哈希也是错的（双重保护）</li>\n<li>明面签名（追踪归属）+ 暗面签名（防伪，与明面逐字节比对）</li></ul>\n\n<h3>实测：8 位中文密码的数学安全性</h3>\n<table><tr><th>密码类型</th><th>空间</th><th>破解耗时</th></tr>\n<tr><td>6 位数字</td><td>10⁶</td><td><b>1 分钟</b> ⚠️</td></tr>\n<tr><td>8 位阿拉伯数字</td><td>10⁸</td><td>100 分钟 ⚠️</td></tr>\n<tr><td>8 位中文数字（〇一二三…）</td><td>2.6×10¹⁰</td><td>18 天 ⚠️</td></tr>\n<tr><td>8 位小写字母</td><td>2.1×10¹¹</td><td>145 天</td></tr>\n<tr><td><b>8 位常用汉字（随机）</b></td><td><b>2.3×10²⁸</b></td><td><b>安全 ✅</b></td></tr></table>\n<div class=\"bk e\">安全与否<b>完全取决于是否真随机</b>。「一二三四五六七八」「我爱你迷你世界」这类有意义短语迟早被字典命中。破解实测 16,667 次/秒。</div>\n\n<h3>混淆产物验收清单</h3>\n<pre>[ ] 能导入，不报错\n[ ] 属性面板正常显示\n[ ] 开放函数在触发器里看得到\n[ ] 调用返回正确值，不是 nil\n[ ] OnStart / OnDestroy 保持原名\n[ ] __index 等元方法没被改名\n[ ] 登记表键与函数名同步改名\n[ ] arrayWrapper 位置正确</pre>\n<div class=\"bk w\">迭代次数别设太高：300 次在测试环境激活约 1.5 秒，游戏真机可能更慢。改迭代必须重新配钥。</div>\n\n<h3>重要认知：混淆 ≠ 加密</h3>\n<p><code>_DEC</code> 的实现就摆在产物里，跟着跑一遍就能解出所有字符串。它只增加阅读成本，<b>不提供密码学保护</b>。真要保护必须靠密钥。</p>"},{"i":"data","t":"💾 数据、云服与存储","b":"<h3>Data（14 函数）</h3>\n<pre>Data.LoadCsv2Table(csv)     <span class=\"c\">-- CSV → table</span>\nData.GetRowByIndex / GetRowByColName / GetRowByColIndex / GetRows\nData.GetValue / SetValue / IncreasesValue / GetVarID\nData.ReadPlayerData / SavePlayerData\nData.ReadPlayerDataToMap / SavePlayerDataToMap\nData.DoPackBluePrint</pre>\n\n<h3>CloudSever（32 函数）</h3>\n<table><tr><th>用途</th><th>函数</th></tr>\n<tr><td>有序数据</td><td>GetOrderDataByKey / SetOrderDataBykey / RemoveOrderDataByKey / GetOrderDataIndexArea / GetOrderDataValueArea / AutomaticByKey / ClearOrderData</td></tr>\n<tr><td>列表数据</td><td>SetDataListValue / GetDataListByKey / SetDataListBykey / RemoveDataListByKey / UpdateDataListByKey / ClearDataList / RemoveDataListValue / GetAnyValueByKey / GetAnyValueByIndex / ClearList</td></tr>\n<tr><td>房间跳</td><td>TransmitToRoom / TransmitToMap / TransmitToCategoryRoom / TransmitToCurMapCategoryRoom / TransmitOtherRoom / GetRoomID / CloseCurRoom / SetForbidJoin</td></tr>\n<tr><td>房间分类</td><td>SetRoomCategory / GetRoomCategory</td></tr>\n<tr><td>其他</td><td>NotifyPlayerTransmitMsg / SendSeverMsg / CheckVarable / __GetMapInfo</td></tr></table>\n\n<h3>二维表硬限制</h3>\n<div class=\"bk e\"><b>500KB / 2000 行</b>。超出必须分表。26M 模型权重实测切进 70 张表。</div>\n<p>压缩链：<code>deflate → Base85 → 分表 → 回读校验</code></p>\n\n<h3>VarType（52 项）</h3>\n<p>Number String Boolean Pos Area BlockType ItemType CreatureType EntityType EffectType Timer Sound Texture Model Blueprint Buff Role Object Entity Player Creature Mob DropItem Projectile Element Map Table ListData SortedData + 各种 Group 变体</p>"},{"i":"snip","t":"✂️ 常用代码模板","b":"<h3>组件骨架（新写法）</h3>\n<pre><span class=\"k\">local</span> M = {}\n\n<span class=\"k\">function</span> M:OnStart()\n    print(<span class=\"s\">\"[组件] 启动\"</span>)\n<span class=\"k\">end</span>\n\n<span class=\"k\">function</span> M:OnDestroy()\n<span class=\"k\">end</span>\n\n<span class=\"k\">return</span> M</pre>\n\n<h3>监听事件</h3>\n<pre><span class=\"k\">function</span> M:OnStart()\n    self:AddTriggerEvent(TriggerEvent.PlayerClickBlock, self.OnClick)\n<span class=\"k\">end</span>\n\n<span class=\"k\">function</span> M:OnClick(e)\n    <span class=\"k\">local</span> playerid = e.eventobjid\n    <span class=\"k\">local</span> x, y, z = e.x, e.y, e.z\n<span class=\"k\">end</span></pre>\n\n<h3>计时器</h3>\n<pre><span class=\"k\">local</span> tid = Timer.CreateTimer()\nTimer.StartForwardTimer(tid, 3.0)      <span class=\"c\">-- 正向 3 秒</span>\nTimer.StartBackwardTimer(tid, 60)      <span class=\"c\">-- 倒计时 60 秒</span>\nTimer.ShowTimerWnd(tid)\n<span class=\"k\">local</span> left = Timer.GetTimerTime(tid)\n<span class=\"k\">if</span> Timer.IsPlaying(tid) <span class=\"k\">then</span> Timer.PauseTimer(tid) <span class=\"k\">end</span>\nTimer.DeleteTimer(tid)</pre>\n\n<h3>玩家 & 实体</h3>\n<pre>Player:GetPosition(playerid)  <span class=\"c\">-- 坐标</span>\nPlayer:SetPosition(playerid, x, y, z)\nPlayer:GetNickname(playerid)\nActor:AddBuff(objid, buffid, lv, ticks)\nWorld:SpawnCreature(x, y, z, creatureid, num)\nWorld:PlayParticleEffect(x, y, z, effectid, scale)</pre>\n\n<h3>背包</h3>\n<pre>Backpack:AddItem(playerid, itemid, num)\nBackpack:GetItemNumByBackpackBar(playerid, itemid, bar)\nBackpack:RemoveGridItem(playerid, gridid, num)\nBackpack:EnoughSpaceForItem(playerid, itemid, num)</pre>\n\n<h3>UI</h3>\n<pre>CustomUI:CreateElement(playerid, ElementType.Text, <span class=\"s\">\"myText\"</span>)\nCustomUI:SetText(playerid, <span class=\"s\">\"myText\"</span>, <span class=\"s\">\"你好\"</span>)\nCustomUI:SetSize(playerid, <span class=\"s\">\"myText\"</span>, 200, 50)\nCustomUI:SetPosition(playerid, <span class=\"s\">\"myText\"</span>, 100, 100)</pre>\n\n<h3>云服定向广播</h3>\n<pre>CloudSever.PushCloudServerMsg(msgId, {a=1, b={x=2}}, roomId)</pre>"}];

</script>
<script>
var $=function(i){return document.getElementById(i)};
var TAB='home',CATSEL='',Q='',OPEN=null;
var FAV=JSON.parse(localStorage.getItem('ugcwiki_fav')||'[]');

function toast(s){var e=$('cp');e.textContent=s;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1200)}
function copy(s){try{navigator.clipboard.writeText(s)}catch(e){} toast('已复制 '+s)}

function infav(n){return FAV.indexOf(n)>=0}
function tgfav(n){var i=FAV.indexOf(n);if(i>=0){FAV.splice(i,1);toast('取消收藏')}else{FAV.push(n);toast('已收藏')}localStorage.setItem('ugcwiki_fav',JSON.stringify(FAV));render()}

function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}

// ---------- 搜索 ----------
function search(q){
  q=q.toLowerCase().trim();if(!q)return null;
  var r=[];
  for(var m in M){
    if(m.toLowerCase().indexOf(q)>=0) r.push({t:'mod',m:m,n:m,d:(CN[m]||'')});
    if(r.length>400) break;
  }
  for(var m2 in M){
    var f=M[m2][0].split(' '),c=M[m2][1].split(' ');
    for(var i=0;i<f.length;i++) if(f[i]&&f[i].toLowerCase().indexOf(q)>=0) r.push({t:'fn',m:m2,n:f[i]});
    for(var j=0;j<c.length;j++) if(c[j]&&c[j].toLowerCase().indexOf(q)>=0) r.push({t:'cst',m:m2,n:c[j]});
    if(r.length>500) break;
  }
  for(var k=0;k<KB.length;k++){
    var a=KB[k];
    if((a.t+a.b).toLowerCase().indexOf(q)>=0) r.push({t:'kb',n:a.i,d:a.t});
  }
  return r;
}

// ---------- 渲染 ----------
function render(){
  var h='';
  if(Q){h=rSearch();}
  else if(TAB=='home') h=rHome();
  else if(TAB=='api') h=rApi();
  else if(TAB=='kb') h=rKb();
  else if(TAB=='fav') h=rFav();
  $('main').innerHTML=h;
  $('chips').innerHTML=rChips();
  var bs=document.querySelectorAll('.nv button');
  for(var i=0;i<bs.length;i++) bs[i].className=(bs[i].dataset.t===TAB?'on':'');
}

function rChips(){
  if(TAB!=='api'||Q) return '';
  var h='<div class="chip'+(CATSEL?'':' on')+'" onclick="selcat(\'\')">全部</div>';
  for(var i=0;i<CAT.length;i++){
    h+='<div class="chip'+(CATSEL===CAT[i][0]?' on':'')+'" onclick="selcat(\''+CAT[i][0]+'\')">'+CAT[i][0]+'</div>';
  }
  return h;
}
function selcat(c){CATSEL=(CATSEL===c?'':c);render()}

function rSearch(){
  var r=search(Q);if(!r||!r.length) return '<div class="empty">没找到「'+esc(Q)+'」</div>';
  var h='<div class="card"><h2>🔍 搜索结果 <span style="font-size:11px;color:var(--dim)">'+r.length+' 条</span></h2>';
  for(var i=0;i<Math.min(r.length,320);i++){
    var x=r[i];
    if(x.t==='mod') h+='<div class="mod" onclick="openmod(\''+x.m+'\')"><div><span class="fn f">'+esc(x.m)+'</span><em style="color:var(--dim);font-size:11px"> '+esc(x.d)+'</em></div><div class="c">模块</div></div>';
    else if(x.t==='kb') h+='<div class="mod" onclick="openkb(\''+x.n+'\')"><div><span style="font-size:13px">📖 '+esc(x.d)+'</span></div><div class="c">秘籍</div></div>';
    else h+='<div class="mod" onclick="openmod(\''+x.m+'\')"><div><span class="fn '+(x.t==='fn'?'f':'c')+'">'+esc(x.n)+'</span></div><div class="c">'+esc(x.m)+'</div></div>';
  }
  if(r.length>320) h+='<div class="empty">仅显示前 320 条，请细化关键词</div>';
  return h+'</div>';
}

function rHome(){
  var h='<div class="grid" style="margin-bottom:10px">';
  h+='<div class="st"><b>'+STATS.mods+'</b><span>模块</span></div>';
  h+='<div class="st"><b>'+STATS.items+'</b><span>API 条目</span></div>';
  h+='<div class="st"><b>'+KB.length+'</b><span>秘籍条目</span></div>';
  h+='<div class="st"><b>1.59.0</b><span>目标版本</span></div></div>';

  h+='<div class="card"><h2>⚡ 快速入口</h2><div class="grid">';
  var qk=[['🔥 引擎铁律','必读·违反=返回nil'],['📡 广播体系','三套机制别混用'],
          ['🧩 组件属性','50+ 类型全表'],['🔧 arrayWrapper','数组返回机理'],
          ['🔀 两套脚本上下文','触发器 vs 组件'],['🕳️ 隐藏接口','官方没写的'],
          ['🛡️ 混淆与保护','防篡改/密钥'],['⚠️ 环境能力','loadstring 等']];
  for(var i=0;i<qk.length;i++) h+='<div class="st" style="cursor:pointer" onclick="quick('+i+')"><b style="font-size:13px">'+qk[i][0]+'</b><span>'+qk[i][1]+'</span></div>';
  h+='</div></div>';

  h+='<div class="card"><h2>📊 模块体积 TOP 15</h2>';
  var arr=[];for(var m in M) arr.push([m,M[m][0].split(' ').filter(Boolean).length]);
  arr.sort(function(a,b){return b[1]-a[1]});
  for(var j=0;j<15;j++){
    var w=Math.round(arr[j][1]/arr[0][1]*100);
    h+='<div style="margin:4px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><span onclick="openmod(\''+arr[j][0]+'\')" style="cursor:pointer;color:var(--ac)">'+arr[j][0]+' <em style="color:var(--dim);font-style:normal">'+esc(CN[arr[j][0]]||'')+'</em></span><span style="color:var(--dim)">'+arr[j][1]+'</span></div>';
    h+='<div style="height:4px;background:var(--bg3);border-radius:2px;margin-top:2px"><div style="height:4px;width:'+w+'%;background:var(--ac);border-radius:2px"></div></div></div>';
  }
  return h+'</div>';
}
function quick(i){TAB='kb';OPEN=KB[i].i;render();window.scrollTo(0,0)}

function rApi(){
  if(OPEN) return rMod(OPEN);
  var list=[];
  if(CATSEL){ for(var i=0;i<CAT.length;i++) if(CAT[i][0]===CATSEL) list=CAT[i][1]; }
  else { for(var m in M) list.push(m); list.sort(); }
  var h='<div class="card" style="padding:0"><div style="padding:10px 12px;font-size:12px;color:var(--dim)">'
      + (CATSEL?esc(CATSEL):'全部模块') + ' · '+list.length+' 个</div>';
  for(var j=0;j<list.length;j++){
    var n=list[j];if(!M[n])continue;
    var f=M[n][0].split(' ').filter(Boolean).length,c=M[n][1].split(' ').filter(Boolean).length;
    h+='<div class="mod" onclick="openmod(\''+n+'\')"><div><span class="n">'+n+'</span><em>'+esc(CN[n]||'')+'</em></div>'
      +'<div style="display:flex;align-items:center;gap:8px"><span class="c">'+(f?'函数 '+f:'')+(f&&c?' · ':'')+(c?'常量 '+c:'')+'</span>'
      +'<span class="star'+(infav(n)?' on':'')+'" onclick="event.stopPropagation();tgfav(\''+n+'\')">★</span></div></div>';
  }
  return h+'</div>';
}
function openmod(n){TAB='api';OPEN=n;render();window.scrollTo(0,0)}
function openkb(i){TAB='kb';OPEN=i;render();window.scrollTo(0,0)}

function rMod(n){
  var d=M[n];if(!d) return '<div class="empty">无此模块</div>';
  var f=d[0].split(' ').filter(Boolean),c=d[1].split(' ').filter(Boolean);
  var h='<div class="card"><h2 onclick="back()" style="cursor:pointer;color:var(--ac)">← '+n
      +' <span style="font-size:11px;color:var(--dim)">'+esc(CN[n]||'')+'</span>'
      +' <span class="star '+(infav(n)?'on':'')+'" style="margin-left:auto;cursor:pointer" onclick="tgfav(\''+n+'\')">★</span></h2>';
  h+='<div style="font-size:12px;color:var(--dim);margin-bottom:6px">函数 '+f.length+' · 常量 '+c.length+'　<span onclick="copy(\''+n+'\')" style="cursor:pointer">复制模块名</span></div>';
  if(f.length){
    h+='<div class="lbl"><i style="background:var(--ac)"></i>函数 '+f.length+'</div>';
    for(var i=0;i<f.length;i++) h+='<span class="fn f" onclick="copy(\''+n+'.'+f[i]+'\')">'+esc(f[i])+'</span>';
  }
  if(c.length){
    h+='<div class="lbl"><i style="background:var(--wn)"></i>常量/枚举 '+c.length+'</div>';
    for(var j=0;j<c.length;j++) h+='<span class="fn c" onclick="copy(\''+n+'.'+c[j]+'\')">'+esc(c[j])+'</span>';
  }
  if(!f.length&&!c.length) h+='<div class="empty">该模块无公开条目</div>';
  return h+'</div>';
}
function back(){if(TAB==='api'){OPEN=null}render()}

function rKb(){
  if(OPEN){
    for(var i=0;i<KB.length;i++) if(KB[i].i===OPEN){
      var a=KB[i];
      return '<div class="card"><h2 onclick="back()" style="cursor:pointer;color:var(--ac)">← 秘籍</h2>'
        +'<h2 style="margin-top:8px">'+a.t+'</h2>'+a.b+'</div>';
    }
  }
  var h='<div class="card"><h2>📖 秘籍 · 官方没写或写不全的</h2>'
    +'<div style="font-size:12px;color:var(--dim)">共 '+KB.length+' 篇，均基于真机实测 / 环境转储</div></div>';
  for(var j=0;j<KB.length;j++){
    h+='<div class="mod" onclick="openkb(\''+KB[j].i+'\')"><div><span class="n">'+KB[j].t+'</span></div><div class="c">›</div></div>';
  }
  return h;
}

function rFav(){
  var h='<div class="card"><h2>⭐ 收藏 '+FAV.length+'</h2>';
  if(!FAV.length) return h+'<div class="empty">还没有收藏<br>在模块页点 ★ 添加</div></div>';
  for(var i=0;i<FAV.length;i++){
    var n=FAV[i];
    h+='<div class="mod"><div onclick="openmod(\''+n+'\')" style="flex:1"><span class="n">'+n+'</span><em>'+esc(CN[n]||'')+'</em></div>'
      +'<span class="star on" onclick="tgfav(\''+n+'\')">★</span></div>';
  }
  return h+'</div>';
}

$('q').addEventListener('input',function(){Q=this.value;OPEN=null;render()});
var bs=document.querySelectorAll('.nv button');
for(var i=0;i<bs.length;i++) bs[i].onclick=function(){TAB=this.dataset.t;OPEN=null;CATSEL='';Q='';$('q').value='';render();window.scrollTo(0,0)};
render();
</script>
</body>
</html>
